name: SSAdesk - motor para Mac com chip Apple (compilado em Intel)

# As máquinas com chip Apple do GitHub vivem lotadas e cancelam o trabalho na fila.
# Esta receita compila a versão de chip Apple numa máquina Intel, que sempre tem vaga.
on:
  workflow_dispatch:

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  ALVO: aarch64-apple-darwin
  MIN_MACOS: "12.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  arm-em-intel:
    name: chip Apple (em máquina Intel)
    runs-on: macos-15-intel
    needs: [generate-bridge]
    steps:
      - name: Variáveis do cache do GitHub
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Baixa o código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Programas de apoio
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: NASM
        run: |
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Correções do Flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Rust com o alvo de chip Apple
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: arm-em-intel

      - name: Pega as peças geradas pela bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Bibliotecas do vcpkg para chip Apple
        run: |
          # O alvo manda no conjunto de bibliotecas: arm64-osx, e não o da máquina (x64-osx).
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Versões em uso
        run: |
          clang --version || true
          rustup toolchain list
          rustc -V
          echo "alvos:"; rustup target list --installed

      - name: Compila o motor para chip Apple
        run: |
          set -e
          # Versão mínima do macOS, igual à da receita original para chip Apple
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          export MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS"

          FEATURES=$(./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit --print-features)
          echo "recursos: $FEATURES"

          # 1) parte em Rust, compilada para chip Apple
          cargo build --locked --features "$FEATURES" --release --target "$ALVO"

          # 2) o projeto do Flutter procura a biblioteca em target/release: colocamos a de chip Apple lá
          mkdir -p target/release
          cp "target/$ALVO/release/liblibrustdesk.dylib" target/release/librustdesk.dylib
          cp "target/$ALVO/release/liblibrustdesk.dylib" target/release/liblibrustdesk.dylib
          [ -f "target/$ALVO/release/service" ] && cp "target/$ALVO/release/service" target/release/service || true
          lipo -info target/release/librustdesk.dylib

          # 3) parte visual, também para chip Apple
          cd flutter
          FLUTTER_XCODE_ARCHS=arm64 FLUTTER_XCODE_ONLY_ACTIVE_ARCH=NO flutter build macos --release
          cp -rf ../target/release/service ./build/macos/Build/Products/Release/RustDesk.app/Contents/MacOS/ || true
          cd ..

          APP=./flutter/build/macos/Build/Products/Release/RustDesk.app
          lipo -info "$APP/Contents/MacOS/RustDesk"
          lipo -info "$APP/Contents/MacOS/RustDesk" | grep -q arm64

      - name: Nome que aparece no Mac
        run: |
          P=./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/Info.plist
          plutil -replace CFBundleName -string "SSAdesk" "$P"
          plutil -replace CFBundleDisplayName -string "SSAdesk" "$P" || plutil -insert CFBundleDisplayName -string "SSAdesk" "$P"

      - name: Gera o arquivo do motor
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 \
            motor-mac-arm64.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app
          ls -la motor-mac-arm64.dmg

      - name: Guarda o motor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-macos-aarch64
          path: motor-mac-arm64.dmg
          if-no-files-found: error
